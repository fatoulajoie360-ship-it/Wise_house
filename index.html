<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carte Anniversaire Safia</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at top, rgba(255,255,255,0.45), transparent 40%),
        linear-gradient(135deg, #dbeeff 0%, #fdf3ea 100%);
    }

    .container {
      position: relative;
      width: 380px;
      height: 560px;
      perspective: 1800px;
    }

    .card {
      position: absolute;
      inset: 0;
      border-radius: 32px;
      overflow: hidden;
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(10px);
      box-shadow:
        0 30px 60px rgba(0,0,0,0.22),
        inset 0 1px 6px rgba(255,255,255,0.6);
      transform: translateY(180px) scale(0.72) rotateX(10deg);
      opacity: 0;
      transition: transform 1.8s cubic-bezier(0.16, 1, 0.3, 1), opacity 1.4s ease;
      will-change: transform, opacity;
    }

    .card.show {
      transform: translateY(0) scale(1) rotateX(0deg);
      opacity: 1;
    }

    .photo {
      width: 100%;
      height: 62%;
      object-fit: cover;
      display: block;
    }

    .content {
      height: 38%;
      padding: 24px;
      text-align: center;
      background: linear-gradient(to bottom, rgba(255,255,255,0.96), rgba(255,248,240,0.98));
    }

    .title {
      font-size: 1rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #c39b47;
      margin-bottom: 12px;
      font-weight: 600;
    }

    .name {
      font-size: 2.8rem;
      font-family: Georgia, serif;
      color: #1d1d1d;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .date {
      color: #777;
      letter-spacing: 2px;
      margin-bottom: 18px;
      font-size: 1rem;
    }

    .message {
      font-size: 1rem;
      line-height: 1.7;
      color: #444;
    }

    .signature {
      margin-top: 16px;
      color: #c39b47;
      font-style: italic;
      font-family: Georgia, serif;
    }

    .envelope {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 10;
      transition: transform 2s cubic-bezier(0.16, 1, 0.3, 1), opacity 1.5s ease, filter 1.5s ease;
      transform-style: preserve-3d;
      will-change: transform, opacity;
    }

    .envelope.open {
      transform: translateY(-260px) scale(0.78) rotateX(10deg);
      opacity: 0;
      filter: blur(2px);
      pointer-events: none;
    }

    .envelope-wrapper {
      position: relative;
      width: 330px;
      height: 220px;
      filter: drop-shadow(0 28px 35px rgba(0,0,0,0.25));
      transition: transform 0.5s ease;
    }

    .envelope:hover .envelope-wrapper {
      transform: translateY(-6px);
    }

    .envelope-back {
      position: absolute;
      inset: 0;
      border-radius: 18px;
      overflow: hidden;
      background: linear-gradient(145deg,#f8ecd9 0%,#e4c9a1 100%);
      border: 1px solid rgba(255,255,255,0.7);
    }

    .envelope-back::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, rgba(255,255,255,0.45), transparent 30%, rgba(255,255,255,0.08), transparent 70%);
    }

    .left-fold,
    .right-fold {
      position: absolute;
      bottom: 0;
      width: 50%;
      height: 100%;
      background: linear-gradient(145deg,#efd8b6,#dbb789);
    }

    .left-fold {
      left: 0;
      clip-path: polygon(0 0,100% 50%,100% 100%,0 100%);
    }

    .right-fold {
      right: 0;
      clip-path: polygon(0 50%,100% 0,100% 100%,0 100%);
    }

    .top-flap {
      position: absolute;
      top: 0;
      width: 100%;
      height: 58%;
      clip-path: polygon(0 0,50% 100%,100% 0);
      background: linear-gradient(145deg,#f4dfbf,#d7ae78);
      transform-origin: top;
      animation: flapMove 4s ease-in-out infinite alternate;
      box-shadow: inset 0 3px 10px rgba(255,255,255,0.4);
    }

    .wax-seal {
      position: absolute;
      left: 50%;
      top: 52%;
      transform: translate(-50%, -50%);
      width: 74px;
      height: 74px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 30px;
      font-family: Georgia, serif;
      font-weight: bold;
      color: white;
      background: radial-gradient(circle at top, #ffe29c, #c7922d 65%, #9e6f18 100%);
      box-shadow:
        0 12px 20px rgba(0,0,0,0.28),
        inset 0 3px 6px rgba(255,255,255,0.5),
        inset 0 -4px 8px rgba(0,0,0,0.18);
      animation: luxuryGlow 2.5s infinite ease-in-out;
    }

    .click-text {
      position: absolute;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      width: 100%;
      text-align: center;
      font-size: 1.35rem;
      font-weight: 700;
      color: #9b6b2f;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 12px rgba(255,255,255,0.95);
      z-index: 999;
      opacity: 1;
      pointer-events: none;
      white-space: nowrap;
      animation: floatingText 2.5s ease-in-out infinite;
    }

    @keyframes floatingText {
      0%, 100% {
        transform: translateX(-50%) translateY(0px);
        opacity: 0.85;
      }

      50% {
        transform: translateX(-50%) translateY(-6px);
        opacity: 1;
      }
    }

    .hearts {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 30;
    }

    .heart {
      position: absolute;
      opacity: 0;
      animation: floatUp 5s linear forwards;
    }

    @keyframes flapMove {
      from {
        transform: rotateX(0deg);
      }
      to {
        transform: rotateX(7deg);
      }
    }

    @keyframes luxuryGlow {
      0%,100% {
        transform: translate(-50%, -50%) scale(1);
        box-shadow: 0 0 18px rgba(255,215,0,0.3);
      }
      50% {
        transform: translate(-50%, -50%) scale(1.05);
        box-shadow: 0 0 35px rgba(255,215,0,0.65);
      }
    }

    @keyframes textGlow {
      0%,100% {
        transform: scale(1);
        opacity: 0.85;
      }
      50% {
        transform: scale(1.04);
        opacity: 1;
      }
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) scale(0.5);
        opacity: 0;
      }
      20% {
        opacity: 1;
      }
      100% {
        transform: translateY(-700px) scale(1.4);
        opacity: 0;
      }
    }

    @media (max-width: 480px) {
      .container {
        transform: scale(0.9);
      }
    }
  </style>
</head>
<body>
  <audio id="birthdayMusic" loop>
  <source src="https://files.catbox.moe/7i57en.mp3" type="audio/mpeg">
</audio>

  <div class="container">
    <div class="card" id="card">
      <img src="https://files.catbox.moe/2l8ky6.jpg" alt="Safia" class="photo">

      <div class="content">
        <div class="title">Une Journée Précieuse</div>
        <div class="name">Safia</div>
        <div class="date">15 MAI 2025</div>

        <div class="message">
          La petite étoile qui illumine nos cœurs ✨
        </div>

        <div class="signature">
          Avec tout notre amour 💛
        </div>
      </div>
    </div>

    <div class="envelope" id="envelope">
      <div class="envelope-wrapper">
        <div class="envelope-back"></div>
        <div class="left-fold"></div>
        <div class="right-fold"></div>
        <div class="top-flap"></div>
        <div class="wax-seal">S</div>
      </div>

      <div class="click-text">💌 Ouvre ta surprise Safia 🎁</div>
    </div>

    <div class="hearts" id="hearts"></div>
  </div>

  <script>
    const envelope = document.getElementById('envelope');
    const card = document.getElementById('card');
    const heartsContainer = document.getElementById('hearts');
    const music = document.getElementById('birthdayMusic');

    let opened = false;
    let heartsInterval = null;
    let confettiInterval = null;

    envelope.addEventListener('click', () => {
      if (opened) return;

      opened = true;

      envelope.classList.add('open');
      card.classList.add('show');

      music.play().catch(() => {});

      confettiInterval = setInterval(() => {
        confetti({
          particleCount: 30,
          spread: 100,
          startVelocity: 35,
          origin: {
            x: Math.random(),
            y: Math.random() - 0.2
          }
        });
      }, 300);

      createHearts();

      heartsInterval = setInterval(() => {
        createHearts();
      }, 2500);
    });

    function createHearts() {
      for (let i = 0; i < 20; i++) {
        const heart = document.createElement('div');

        heart.className = 'heart';
        heart.innerHTML = '💖';

        heart.style.left = Math.random() * 100 + '%';
        heart.style.bottom = '-30px';
        heart.style.fontSize = 20 + Math.random() * 20 + 'px';
        heart.style.animationDelay = Math.random() * 1.5 + 's';

        heartsContainer.appendChild(heart);

        setTimeout(() => {
          heart.remove();
        }, 5500);
      }
    }
  </script>
</body>
</html>
