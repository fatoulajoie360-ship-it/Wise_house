<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wonder's Cards</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #dbeeff 0%, #fdf3ea 100%);
      padding: 40px 20px;
      color: #222;
    }

    .container {
      max-width: 1200px;
      margin: auto;
    }

    .hero {
      text-align: center;
      margin-bottom: 50px;
    }

    .hero h1 {
      font-size: 3rem;
      margin-bottom: 15px;
      color: #9b6b2f;
    }

    .hero p {
      font-size: 1.1rem;
      color: #555;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 25px;
      margin-bottom: 60px;
    }

    .card {
      background: rgba(255,255,255,0.92);
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0,0,0,0.12);
      transition: transform 0.35s ease;
    }

    .card:hover {
      transform: translateY(-8px);
    }

    .card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
    }

    .card-content {
      padding: 24px;
      text-align: center;
    }

    .card-content h2 {
      margin-bottom: 12px;
      color: #9b6b2f;
    }

    .card-content p {
      color: #666;
      line-height: 1.5;
      margin-bottom: 18px;
    }

    .select-btn {
      padding: 12px 22px;
      border: none;
      border-radius: 18px;
      background: linear-gradient(145deg,#f4dfbf,#d7ae78);
      color: #5e3d10;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .select-btn:hover {
      transform: scale(1.05);
    }

    .form-section {
      max-width: 650px;
      margin: auto;
      background: rgba(255,255,255,0.94);
      border-radius: 30px;
      padding: 35px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.12);
    }

    .form-section h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #9b6b2f;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 15px;
      border-radius: 18px;
      border: 1px solid rgba(0,0,0,0.1);
      outline: none;
      font-size: 1rem;
    }

    textarea {
      min-height: 120px;
      resize: none;
    }

    .submit-btn {
      padding: 16px;
      border: none;
      border-radius: 18px;
      background: linear-gradient(145deg,#f4dfbf,#d7ae78);
      color: #5e3d10;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .submit-btn:hover {
      transform: scale(1.03);
    }

    @media (max-width: 768px) {
      .hero h1 {
        font-size: 2.2rem;
      }

      .form-section {
        padding: 25px;
      }
    }
  </style>
</head>
<body>

  <div class="container">

    <div class="hero">
      <h1>💖 Wonder's Cards</h1>
      <p>Choisissez votre carte interactive personnalisée ✨</p>
    </div>

    <div class="cards-grid">

      <div class="card">
        <img src="https://images.unsplash.com/photo-1464349153735-7db50ed83c84?q=80&w=1200&auto=format&fit=crop" alt="Anniversaire">

        <div class="card-content">
          <h2>🎂 Anniversaire</h2>
          <p>Carte interactive avec photo, musique et animations.</p>

          <button class="select-btn" onclick="selectCard('Anniversaire')">
            Choisir
          </button>
        </div>
      </div>

      <div class="card">
        <img src="https://images.unsplash.com/photo-1511285560929-80b456fea0bc?q=80&w=1200&auto=format&fit=crop" alt="Mariage">

        <div class="card-content">
          <h2>💍 Mariage</h2>
          <p>Une invitation élégante et premium pour votre mariage.</p>

          <button class="select-btn" onclick="selectCard('Mariage')">
            Choisir
          </button>
        </div>
      </div>

      <div class="card">
        <img src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?q=80&w=1200&auto=format&fit=crop" alt="Amour">

        <div class="card-content">
          <h2>💌 Amour</h2>
          <p>Une surprise romantique avec animations et musique.</p>

          <button class="select-btn" onclick="selectCard('Amour')">
            Choisir
          </button>
        </div>
      </div>

    </div>

    <div class="form-section">
      <h2>📩 Commander votre carte</h2>

      <form action="https://formsubmit.co/jonctioncyber7@gmail.com" method="POST">

        <input type="hidden" name="_subject" value="Nouvelle commande Wonder's Cards">

        <input type="text" name="Nom" placeholder="Votre nom" required>

        <input type="email" name="Email" placeholder="Votre email" required>

        <input type="text" name="WhatsApp" placeholder="Votre numéro WhatsApp">

        <input type="text" id="selectedCard" name="Type de carte" placeholder="Type de carte choisi" required>

        <textarea name="Message" placeholder="Décrivez votre projet..."></textarea>

        <button type="submit" class="submit-btn">
          Envoyer la commande ✨
        </button>
      </form>
    </div>
  </div>

  <script>
    function selectCard(type) {
      document.getElementById('selectedCard').value = type;

      window.scrollTo({
        top: document.querySelector('.form-section').offsetTop,
        behavior: 'smooth'
      });
    }
  </script>
</body>
</html>
